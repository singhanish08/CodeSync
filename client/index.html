<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c12" />

    <title>CodeSync — Real-time collaborative code editor with AI</title>
    <meta
      name="description"
      content="CodeSync is a real-time collaborative code editor with conflict-free syncing, live multiplayer cursors, and an AI that explains, reviews and refactors alongside your team."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CodeSync" />
    <meta property="og:title" content="CodeSync — Real-time collaborative code editor with AI" />
    <meta
      property="og:description"
      content="Write code together with conflict-free syncing, live cursors, and an AI reviewer in the room."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeSync — Real-time collaborative code editor with AI" />
    <meta
      name="twitter:description"
      content="Write code together with conflict-free syncing, live cursors, and an AI reviewer in the room."
    />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong one. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('codesync-theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'eyeshield'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
